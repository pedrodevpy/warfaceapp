<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' https: data:"
    />
    <title>Switchboard</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <header id="top"></header>
    <nav id="rail" aria-label="Services">
      <div id="services"></div>
      <button id="update" class="tile update" type="button" hidden aria-label="Install the update">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4.5v10M7.5 10.5 12 15l4.5-4.5M6 19h12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="toggle-notifications" class="tile" type="button" title="Notificaciones en pantalla" aria-label="Notificaciones en pantalla">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-on">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-off" style="display: none;">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="toggle-sound" class="tile" type="button" title="Sonido de mensajes" aria-label="Sonido de mensajes">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-on">
          <path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-off" style="display: none;">
          <path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="add" class="tile" type="button" title="Add a service  ⌘N" aria-label="Add a service">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5.5v13M5.5 12h13" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
        </svg>
      </button>
    </nav>
    <main id="stage"></main>
    <script src="ui.js"></script>
  </body>
</html>
